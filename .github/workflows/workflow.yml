
name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test Java project
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: CHAT_e2ee

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: CHAT_e2ee/pom.xml

      - name: Build project
        run: mvn -B compile

      - name: Run tests
        run: mvn -B test

      - name: Verify project
        run: mvn -B verify
